name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip  # réutilise les paquets téléchargés d'un run à l'autre

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t defect-vision .

      - name: Smoke test (the main libraries import inside the image)
        run: docker run --rm defect-vision python -c "import torch, cv2, onnxruntime, sklearn; print('imports OK')"
